<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Animated Rainbow Gradient -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a">
        <animate attributeName="stop-color" values="#ff007a;#ff0055;#ff7700;#ffea00;#00ff88;#00d4ff;#b000ff;#ff007a" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="33%" stop-color="#ff7700">
        <animate attributeName="stop-color" values="#ff7700;#ffea00;#00ff88;#00d4ff;#b000ff;#ff007a;#ff0055;#ff7700" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="66%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#b000ff;#ff007a;#ff0055;#ff7700;#ffea00;#00ff88;#00d4ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#b000ff">
        <animate attributeName="stop-color" values="#b000ff;#ff007a;#ff0055;#ff7700;#ffea00;#00ff88;#00d4ff;#b000ff" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtle Inner Glow Gradient -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Rainbow Aura Glow Filter -->
    <filter id="rainbowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deepGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes heartBeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.08); }
      28% { transform: scale(1); }
      42% { transform: scale(1.08); }
      70% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    @keyframes rotateHue {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    @keyframes sparkleFade {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .animated-heart {
      transform-origin: 32px 32px;
      animation: heartBeat 2.8s ease-in-out indefinite;
    }
    .sparkle-1 {
      animation: sparkleFade 1.8s ease-in-out infinite;
      transform-origin: 12px 14px;
    }
    .sparkle-2 {
      animation: sparkleFade 2.2s ease-in-out infinite 0.9s;
      transform-origin: 52px 16px;
    }
    .sparkle-3 {
      animation: sparkleFade 1.5s ease-in-out infinite 0.4s;
      transform-origin: 48px 46px;
    }
  </style>

  <!-- Ambient Rainbow Aura Background Glow -->
  <path 
    class="animated-heart"
    d="M 32 55 C 20 43, 8 31, 8 19 C 8 10.5, 14.5 4, 23 4 C 28.5 4, 32 7.5, 32 7.5 C 32 7.5, 35.5 4, 41 4 C 49.5 4, 56 10.5, 56 19 C 56 31, 44 43, 32 55 Z" 
    fill="url(#rainbowGrad)" 
    opacity="0.6"
    filter="url(#deepGlow)" 
  />

  <!-- Main Premium Heart Body -->
  <path 
    class="animated-heart"
    d="M 32 54 C 20.5 42.5, 9 30.5, 9 19 C 9 11, 15 5, 23 5 C 28 5, 31.5 8, 32 8.8 C 32.5 8, 36 5, 41 5 C 49 5, 55 11, 55 19 C 55 30.5, 43.5 42.5, 32 54 Z" 
    fill="url(#rainbowGrad)" 
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#rainbowGlow)"
  />

  <!-- Glossy Glass Highlight Layer -->
  <path 
    class="animated-heart"
    d="M 32 9 C 30.5 7.5, 27 5.5, 23 5.5 C 16 5.5, 10.5 11, 10.5 18 C 10.5 24, 15 32, 23 39 C 27 42.5, 30.5 45.5, 32 47 C 33.5 45.5, 37 42.5, 41 39 C 49 32, 53.5 24, 53.5 18 C 53.5 11, 48 5.5, 41 5.5 C 37 5.5, 33.5 7.5, 32 9 Z" 
    fill="url(#shineGrad)" 
    opacity="0.85"
  />

  <!-- Diamond Sparkles for Premium Effect -->
  <path class="sparkle-1" d="M 12 10 L 14 14 L 18 16 L 14 18 L 12 22 L 10 18 L 6 16 L 10 14 Z" fill="#ffffff" />
  <path class="sparkle-2" d="M 52 12 L 53.5 15 L 56.5 16.5 L 53.5 18 L 52 21 L 50.5 18 L 47.5 16.5 L 50.5 15 Z" fill="#ffffff" />
  <path class="sparkle-3" d="M 48 44 L 49 46.5 L 51.5 47.5 L 49 48.5 L 48 51 L 47 48.5 L 44.5 47.5 L 47 46.5 Z" fill="#ffffff" />
</svg>
